<!DOCTYPE html>
<html lang="en-GB">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Home Vault: your receipts and home inventory, even if your phone is gone. Sign in to view items and download your lists.">
  <meta name="theme-color" content="#183A34">
  <meta name="robots" content="noindex">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Home Vault">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Home Vault</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { background: #F5F6F2; margin: 0; }
    #loading { position: fixed; inset: 0; display: flex; align-items: center;
      justify-content: center; font: 600 18px system-ui, sans-serif; color: #183A34; }
  </style>
</head>
<body>
  <div id="loading">Home Vault</div>
  <!-- PDF.js renders original PDF receipts in the viewer (pdfx). -->
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.min.mjs" type="module"></script>
  <script type="module">
    var { pdfjsLib } = globalThis;
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.worker.mjs';
    var pdfRenderOptions = {
      cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/cmaps/',
      cMapPacked: true,
    };
  </script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) el.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
